# preseed.cfg — Debian 13 (trixie) netinst answers for Claude OS.
#
# Usage: at the installer boot menu press <e> on "Install", append to the
# linux line:   auto=true priority=critical url=<http url of this file>
# or copy it to the USB root as preseed.cfg and boot "Automated install".
# See docs/INSTALL.md.
#
# PARTITIONING IS DELIBERATELY NOT PRESEEDED. The machine dual-boots Windows;
# an automated recipe that guesses the wrong disk/partition could destroy it.
# The manual steps (btrfs on the old Zorin partition, keep ESP, keep NTFS)
# are in docs/INSTALL.md — they are the only interactive part of the install.

# --- localisation -------------------------------------------------------------
d-i debian-installer/locale string en_GB.UTF-8
d-i keyboard-configuration/xkb-keymap select gb

# --- network / hostname ---------------------------------------------------------
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string claude-os
d-i netcfg/get_domain string lan
d-i netcfg/hostname string claude-os

# --- mirror ---------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- users -----------------------------------------------------------------------
# Root account disabled; ian gets sudo. Passwords are asked interactively on
# purpose (no default credentials baked into a public repo).
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Ian
d-i passwd/username string ian

# --- clock -----------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string Europe/London
d-i clock-setup/ntp boolean true

# --- apt / tasksel: standard utilities + ssh, NO desktop ---------------------------
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
tasksel tasksel/first multiselect ssh-server, standard
d-i pkgsel/include string git curl ca-certificates btrfs-progs
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# --- grub: this machine keeps its Windows partition bootable ------------------------
d-i grub-installer/only_debian boolean false
d-i grub-installer/with_other_os boolean true

# --- late: put the repo where first boot expects it ----------------------------------
d-i preseed/late_command string \
    in-target git clone https://github.com/PointOfPressure/claude-os.git /opt/claude-os || true

d-i finish-install/reboot_in_progress note
