# /etc/environment.d/50-claude-os.conf — managed by claude-os.
# Same vars as /etc/environment, but for systemd *user* services
# (pam_env does not cover those).
NO_COLOR=1
CLICOLOR=0
PAGER=cat
GIT_PAGER=cat
MANPAGER=cat
SYSTEMD_PAGER=
DEBIAN_FRONTEND=noninteractive
NPM_CONFIG_FUND=false
NPM_CONFIG_AUDIT=false
NPM_CONFIG_PROGRESS=false
NPM_CONFIG_LOGLEVEL=warn
PIP_PROGRESS_BAR=off
PIP_DISABLE_PIP_VERSION_CHECK=1
PIP_NO_INPUT=1
UV_NO_PROGRESS=1
DOTNET_CLI_TELEMETRY_OPTOUT=1
DOTNET_NOLOGO=1
PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright
