# /etc/ssh/sshd_config.d/claude-os.conf: managed by claude-os.
# NOTE: stage 70 only deploys this file once a real public key exists in
# ~ian/.ssh/authorized_keys, so a fresh install can't lock itself out.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PrintMotd no
PrintLastLog no
UseDNS no
